# Atuin shell history. Full reference: https://docs.atuin.sh/configuration/config/
# Everything stays on this machine: no sync server, no hosted AI, no update checks.

# Enter runs the selected command immediately, Tab puts it on the prompt to edit
enter_accept = true

# Fuzzy search served by the background daemon
search_mode = "daemon-fuzzy"

# Commands never recorded (regexes, matched against the whole command)
history_filter = [
  "^ls$",
  "^ls ",
  "^cd$",
  "^cd ",
  "^pwd$",
  "^exit$",
  "^date$",
  " --help$",
]

[sync]
records = true
# Never contact a sync server, even if one gets configured by accident
auto_sync = false

# Do not phone home to check for new versions
update_check = false

[daemon]
enabled = true
autostart = true

[ai]
enabled = false
